name: Test, build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  HEROKU_APP_NAME: invoice-backend-app
  HEROKU_APP_URL: https://invoice-backend-app-69d26786220b.herokuapp.com

# Keep releases serialized while each PR validates independently.
concurrency:
  group: main-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Select release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Derive a stable version for this workflow run
        id: version
        run: |
          python3 .github/scripts/release-version.py >> "$GITHUB_OUTPUT"

  test:
    name: All available tests
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      mongodb:
        image: mongo:8.0
        env:
          # Disposable credentials used only by this job's database.
          MONGO_INITDB_ROOT_USERNAME: invoice_ci
          MONGO_INITDB_ROOT_PASSWORD: invoice_ci_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check backend deployment output handling
        run: python3 -m unittest discover -s tests -p test_backend_image_id.py -v
      - uses: docker/setup-buildx-action@v4
      - name: Build all test executables
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tests
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: invoke-invoice-tests:ci
          cache-from: type=gha,scope=invoice
          cache-to: type=gha,mode=max,scope=invoice
      - name: Run every registered CTest suite
        env:
          MONGODB_URI: mongodb://invoice_ci:invoice_ci_password@127.0.0.1:27017/InvokeInvoiceSystemCI?authSource=admin
          MONGODB_DATABASE: InvokeInvoiceSystemCI
        run: |
          mkdir -p test-results
          docker run --rm --network host \
            --env MONGODB_URI --env MONGODB_DATABASE \
            --volume "$PWD/test-results:/test-results" \
            invoke-invoice-tests:ci \
            /usr/bin/ctest --test-dir /app/build --output-on-failure \
              --no-tests=error --output-junit /test-results/ctest.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  frontend:
    name: Build Windows frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: version
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_MAX_CONCURRENCY: 2
      VCPKG_DISABLE_METRICS: 1
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Require update signing configuration
        shell: pwsh
        env:
          UPDATE_SIGNING_CONFIGURED: ${{ secrets.INVOICE_UPDATE_SIGNING_KEY != '' }}
        run: |
          if ($env:UPDATE_SIGNING_CONFIGURED -ne 'true') {
            throw 'Configure INVOICE_UPDATE_SIGNING_KEY before publishing an update-enabled frontend.'
          }
      - name: Set dependency directories
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:RUNNER_TEMP/invoice-vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-cache" >> $env:GITHUB_ENV
      - name: Cache Windows dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-2022-x64-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/x64-windows-static-custom.cmake') }}
          restore-keys: vcpkg-windows-2022-x64-static-
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $baseline = (Get-Content vcpkg-configuration.json -Raw | ConvertFrom-Json).'default-registry'.baseline
          git init $env:VCPKG_ROOT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build versioned frontend
        shell: pwsh
        run: |
          cmake --preset x64-static-release "-DINVOICE_APP_VERSION=$env:APP_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset x64-static-release --target InvokeInvoiceSystem --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify and stage standalone frontend EXE
        shell: pwsh
        run: ./.github/scripts/package-frontend.ps1 -Version $env:APP_VERSION -BuildDirectory out/build/x64-static-release -Static
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-windows
          path: |
            out/release/*.exe
            out/release/*-licenses.txt
            out/release/*.sha256
          if-no-files-found: error

  backend:
    name: Build and push backend to Heroku
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      image_id: ${{ steps.image_id.outputs.image_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment credentials
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::Add the HEROKU_API_KEY repository secret before deploying."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Heroku Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}
      - name: Build and push backend image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64
          # Heroku requires a single Docker V2 image, without an OCI image index.
          provenance: false
          sbom: false
          outputs: type=registry,name=registry.heroku.com/${{ env.HEROKU_APP_NAME }}/web,oci-mediatypes=false
          cache-from: type=gha,scope=invoice
          cache-to: type=gha,mode=max,scope=invoice

      # Only parse metadata after a successful push. Failed/skipped builds leave
      # a plain empty job output, preserving the original error during cleanup.
      - name: Validate backend image ID
        id: image_id
        env:
          BUILD_METADATA: ${{ steps.image.outputs.metadata }}
        run: python3 .github/scripts/backend-image-id.py

  deploy:
    name: Release backend on Heroku
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Release this run's backend image
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          IMAGE_ID: ${{ needs.backend.outputs.image_id }}
        run: |
          set -euo pipefail
          if [ -z "$HEROKU_API_KEY" ] || [[ ! "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Missing deployment credentials or invalid backend image ID."
            exit 1
          fi
          # Heroku expects the image config ID, not the registry manifest digest.
          # Release the exact image built by this run, even if the web tag changes.
          jq -n --arg image "$IMAGE_ID" \
            '{updates: [{type: "web", docker_image: $image}]}' > release.json
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 120 \
            --request PATCH "https://api.heroku.com/apps/$HEROKU_APP_NAME/formation" \
            --header "Authorization: Bearer $HEROKU_API_KEY" \
            --header 'Accept: application/vnd.heroku+json; version=3.docker-releases' \
            --header 'Content-Type: application/json' \
            --data-binary @release.json --output release-response.json
      - name: Verify deployed backend version
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if version=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$HEROKU_APP_URL/") && [ "$version" = "$APP_VERSION" ]; then
              echo "Backend $APP_VERSION is running on Heroku."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Heroku did not serve expected backend version $APP_VERSION. Check the app's release and logs."
          exit 1

  release:
    name: Publish frontend on GitHub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, frontend, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: frontend-windows
          path: release-assets
      - name: Sign and verify update manifest
        env:
          INVOICE_UPDATE_SIGNING_KEY: ${{ secrets.INVOICE_UPDATE_SIGNING_KEY }}
        run: |
          python3 .github/scripts/sign-update.py --version "$APP_VERSION"             --asset "release-assets/InvokeInvoiceSystem-$APP_VERSION-windows-x64.exe"             --output-dir release-assets
      # GitHub adds separate source-code ZIP/tar.gz downloads for the release tag.
      - name: Publish standalone EXE, notices and checksum
        run: |
          tag="v$APP_VERSION"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
              echo "::error::Release tag $tag already belongs to another commit."
              exit 1
            }
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "InvokeInvoiceSystem $APP_VERSION" --generate-notes
          fi
          # Published releases are immutable on reruns; only finish an incomplete draft.
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$tag" release-assets/*.exe release-assets/*-licenses.txt release-assets/*.sha256 release-assets/update-windows-x64.json release-assets/update-windows-x64.sig --clobber
            gh release edit "$tag" --draft=false --latest
          fi
